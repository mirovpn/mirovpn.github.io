<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文档梯子优惠码 15% OFF</title>
    <style>
        body {
            font-family: "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f5f5f5;
            color: #222;
        }
        .container {
            max-width: 720px;
            margin: 60px auto;
            padding: 40px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
        }
        h1 {
            margin-top: 0;
            font-size: 2rem;
            text-align: center;
            color: #0b3d91;
        }
        p {
            line-height: 1.6;
            text-align: center;
        }
        .recommendation {
            margin-top: 20px;
            padding: 18px 24px;
            border-left: 4px solid #0b3d91;
            background: #eef4ff;
            border-radius: 10px;
        }
        .code-list {
            margin-top: 30px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .code-card {
            padding: 24px;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            background: linear-gradient(135deg, #edf2ff, #f8f9ff);
            flex: 1 1 320px;
        }
        .code-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .code-value {
            font-family: "Courier New", Courier, monospace;
            font-size: 1.2rem;
            padding: 10px 12px;
            background: #fff;
            border-radius: 8px;
            border: 1px dashed #0b3d91;
            display: inline-block;
        }
        .code-actions {
            margin-top: 14px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }
        .copy-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 999px;
            background: #0b3d91;
            color: #fff;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.2s ease;
        }
        .copy-btn:hover {
            background: #0950c4;
            transform: translateY(-1px);
        }
        .copy-btn:active {
            transform: translateY(0);
        }
        .buy-button {
            display: inline-block;
            margin-top: 40px;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            background: #ff8a00;
            text-decoration: none;
            border-radius: 30px;
            box-shadow: 0 10px 20px rgba(255, 138, 0, 0.25);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .buy-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 26px rgba(255, 138, 0, 0.3);
        }
        footer {
            margin-top: 50px;
            font-size: 0.85rem;
            text-align: center;
            color: #777;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>文档梯子 15% 优惠码</h1>
        <p>限时折扣，年付方案使用以下优惠码立减 15%。</p>

        <div class="recommendation">
            <strong>推荐梯子：</strong>文档梯子采用高品质节点，支持多平台客户端，提供稳定低延迟的连接体验，是日常访问海外网站、学术研究与影音流媒体的可靠选择。
        </div>

        <div class="code-list">
            <div class="code-card">
                <div class="code-title">15% 无限流量 年套餐可用</div>
                <div class="code-value">2025-year-15off-unlimited</div>
                <div class="code-actions">
                    <button class="copy-btn" data-code="2025-year-15off-unlimited">复制优惠码</button>
                </div>
            </div>

            <div class="code-card">
                <div class="code-title">15% Standard 500GB 年套餐可用</div>
                <div class="code-value">2025-year-15off-500gb</div>
                <div class="code-actions">
                    <button class="copy-btn" data-code="2025-year-15off-500gb">复制优惠码</button>
                </div>
            </div>
        </div>

        <p>
            <a class="buy-button" href="https://mitce.net/aff.php?aff=4065" target="_blank" rel="noopener noreferrer">新页面打开</a>
        </p>

        <footer>优惠码有效期与活动详情以官方公告为准。</footer>
    </div>
    <script>
        document.querySelectorAll('.copy-btn').forEach(function(button) {
            button.addEventListener('click', function() {
                const code = this.getAttribute('data-code');
                navigator.clipboard.writeText(code).then(() => {
                    const original = this.textContent;
                    this.textContent = '已复制！';
                    this.disabled = true;
                    setTimeout(() => {
                        this.textContent = original;
                        this.disabled = false;
                    }, 1800);
                }).catch(() => {
                    alert('复制失败，请手动选取优惠码。');
                });
            });
        });
    </script>
</body>
</html>
